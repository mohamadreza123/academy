<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت آکادمی ورزشکاران</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/rtl.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">سامانه مدیریت آکادمی ورزشکاران</h2>
        <div class="card shadow p-4">
            <h4>ثبت‌نام ورزشکار جدید</h4>
            <form id="athleteForm" class="mt-3">
                <div class="mb-3">
                    <label class="form-label">نام و نام خانوادگی</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">کد ملی</label>
                    <input type="text" id="national_id" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">کمربند / درجه</label>
                    <input type="text" id="belt" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">وزن</label>
                    <input type="text" id="weight_category" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-100">ثبت اطلاعات</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="server.js"></script>
</body>
</html>
